apply plugin: 'com.android.application'

android {
    namespace = "com.gymbro.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.gymbro.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /**
     * Release signing, read from keystore.properties — which is not in git.
     *
     * The app is sideloaded to gym members rather than published, so the
     * signing key is the only thing that makes an update *this* app rather
     * than someone else's repackaged copy. Android refuses to install an
     * update signed by a different key, which is the protection; it only works
     * if the key stays the same, and secret.
     */
    signingConfigs {
        release {
            def props = new Properties()
            def f = rootProject.file("keystore.properties")
            if (f.exists()) {
                f.withInputStream { props.load(it) }
                // rootProject, not file(): paths in keystore.properties are
                // relative to android/, where that file lives, not to app/.
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // R8 shrinks and renames. It is not obfuscation worth relying on,
            // but it removes the free map of the codebase that an unminified
            // APK hands to anyone who unzips it.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig rootProject.file("keystore.properties").exists()
                ? signingConfigs.release
                : null
            // Belt and braces: a release build is not debuggable by default,
            // and saying so stops a later edit making it so by accident.
            debuggable false
        }
        debug {
            // Keep debug builds distinguishable on a phone, so a tester never
            // has to guess which one is installed.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    // Java version is deliberately NOT pinned here.
    //
    // capacitor.build.gradle is generated on every `cap sync`, sets
    // compileOptions to Java 21, and is applied after this file — so anything
    // set here is either overwritten or, worse, half-overwritten: pinning a 17
    // toolchain while the generated file asks for source 21 fails with
    // "invalid source release: 21", which reads like a missing JDK rather than
    // a conflict we created.
    //
    // Gradle must therefore run on JDK 21. See mobile/README.md.
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
