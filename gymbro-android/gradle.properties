# Memory-tuned for this machine: builds were dying with native malloc
# failures. Smaller heaps plus an in-process Kotlin compiler avoid spawning a
# second multi-hundred-MB JVM alongside the Gradle daemon.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official
android.useAndroidX=true
